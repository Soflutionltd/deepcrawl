<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" rx="12" fill="url(#bg)"/>
  <!-- Spider/crawl icon -->
  <circle cx="80" cy="100" r="16" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
  <circle cx="80" cy="100" r="6" fill="url(#accent)" opacity="0.6"/>
  <!-- Web lines -->
  <line x1="64" y1="84" x2="52" y2="68" stroke="#06b6d4" stroke-width="1.5" opacity="0.5"/>
  <line x1="96" y1="84" x2="108" y2="68" stroke="#8b5cf6" stroke-width="1.5" opacity="0.5"/>
  <line x1="64" y1="116" x2="52" y2="132" stroke="#06b6d4" stroke-width="1.5" opacity="0.5"/>
  <line x1="96" y1="116" x2="108" y2="132" stroke="#8b5cf6" stroke-width="1.5" opacity="0.5"/>
  <line x1="60" y1="100" x2="44" y2="100" stroke="#06b6d4" stroke-width="1.5" opacity="0.4"/>
  <line x1="100" y1="100" x2="116" y2="100" stroke="#8b5cf6" stroke-width="1.5" opacity="0.4"/>
  <!-- Title -->
  <text x="140" y="95" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700">deepcrawl</text>
  <text x="140" y="125" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16">Clone, scrape and crawl any website. Free Firecrawl alternative.</text>
  <!-- Tags -->
  <rect x="140" y="145" width="70" height="24" rx="12" fill="#06b6d4" opacity="0.15"/>
  <text x="175" y="161" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">scrape</text>
  <rect x="220" y="145" width="60" height="24" rx="12" fill="#8b5cf6" opacity="0.15"/>
  <text x="250" y="161" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">clone</text>
  <rect x="290" y="145" width="60" height="24" rx="12" fill="#06b6d4" opacity="0.15"/>
  <text x="320" y="161" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">crawl</text>
  <rect x="360" y="145" width="52" height="24" rx="12" fill="#8b5cf6" opacity="0.15"/>
  <text x="386" y="161" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">map</text>
  <rect x="422" y="145" width="52" height="24" rx="12" fill="#06b6d4" opacity="0.15"/>
  <text x="448" y="161" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">free</text>
  <!-- MCP badge -->
  <rect x="640" y="82" width="120" height="36" rx="18" fill="white" opacity="0.08"/>
  <text x="700" y="105" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">MCP Server</text>
</svg>
